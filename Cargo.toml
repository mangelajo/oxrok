[package]
name = "oxrok"
description = "An experimental sigrok compatible logic analyzer, multimeter and oscilloscope stack in Rust: library and command line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["sigrok", "logic-analyzer", "oscilloscope", "multimeter"]
categories = ["hardware-support", "command-line-utilities"]
exclude = ["hil/", "tools/", "docs/"]

[lib]
name = "oxrok"
path = "src/lib.rs"

[[bin]]
name = "oxrok"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "nusb"]
# The command line tool.
cli = ["dep:clap", "dep:ctrlc"]
# Pure Rust USB backend (Linux, macOS, Windows, Android).
nusb = ["dep:nusb"]
# libusb backend, for the BSDs and as a fallback; builds libusb from
# source. OXROK_USB_BACKEND=libusb selects it at run time.
libusb = ["dep:rusb"]
# Run libsigrokdecode's Python decoders through the system Python.
python = ["dep:pyo3"]

[dependencies]
log.workspace = true
thiserror.workspace = true
clap = { workspace = true, optional = true }
ctrlc = { version = "3", optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
nusb = { version = "0.2.8", optional = true }
rusb = { version = "0.9.4", optional = true, features = ["vendored"] }
serialport = { version = "4", default-features = false }
async-hid = { version = "0.5", default-features = false, features = ["async-io", "win32"] }
async-io = "2"
futures-lite = "2"
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["hil/oxrok-hil"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/mangelajo/oxrok"
authors = ["Miguel Angel Ajo <mangel.ajo@gmail.com>"]

[workspace.dependencies]
oxrok = { path = ".", version = "0.1.0-alpha.1", default-features = false }
log = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
