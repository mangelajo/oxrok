[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/formats",
    "crates/usb",
    "crates/ftdi",
    "crates/ezusb",
    "crates/drivers/demo",
    "crates/drivers/logicport",
    "crates/drivers/fx2lafw",
    "crates/decode",
    "crates/decoders",
    "crates/cli",
    "crates/hil",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mangelajo/oxrok"
authors = ["Miguel Angel Ajo <mangel.ajo@gmail.com>"]

[workspace.dependencies]
oxrok-core = { path = "crates/core", version = "0.1.0" }
oxrok-formats = { path = "crates/formats", version = "0.1.0" }
oxrok-usb = { path = "crates/usb", version = "0.1.0", default-features = false }
oxrok-ftdi = { path = "crates/ftdi", version = "0.1.0" }
oxrok-ezusb = { path = "crates/ezusb", version = "0.1.0" }
oxrok-driver-demo = { path = "crates/drivers/demo", version = "0.1.0" }
oxrok-driver-logicport = { path = "crates/drivers/logicport", version = "0.1.0" }
oxrok-driver-fx2lafw = { path = "crates/drivers/fx2lafw", version = "0.1.0" }
oxrok-decode = { path = "crates/decode", version = "0.1.0" }
oxrok-decoders = { path = "crates/decoders", version = "0.1.0" }
log = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
