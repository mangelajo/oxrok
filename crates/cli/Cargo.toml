[package]
name = "oxrok"
description = "A sigrok compatible logic analyzer command line tool, in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["logic-analyzer", "sigrok", "cli", "oscilloscope"]
categories = ["command-line-utilities", "hardware-support"]

[features]
default = []
# Run libsigrokdecode's Python decoders through the system Python.
python = ["dep:oxrok-pydecode"]
# Add the libusb backend; OXROK_USB_BACKEND=libusb selects it.
libusb = ["oxrok-usb/libusb"]

[lints]
workspace = true

[[bin]]
name = "oxrok"
path = "src/main.rs"

[dependencies]
oxrok-core.workspace = true
oxrok-formats.workspace = true
oxrok-driver-demo.workspace = true
oxrok-driver-logicport.workspace = true
oxrok-driver-fx2lafw.workspace = true
oxrok-driver-serial-dmm.workspace = true
oxrok-driver-rigol-ds.workspace = true
oxrok-driver-raspberrypi-pico.workspace = true
oxrok-decode.workspace = true
oxrok-decoders.workspace = true
oxrok-pydecode = { workspace = true, optional = true }
oxrok-usb = { workspace = true, features = ["nusb"] }
clap.workspace = true
log.workspace = true
ctrlc = "3"
