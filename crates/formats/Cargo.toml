[package]
name = "oxrok-formats"
description = "File formats and text outputs of oxrok: sigrok compatible bits, hex, ascii and analog outputs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["logic-analyzer", "sigrok", "vcd"]
categories = ["encoding", "hardware-support"]

[lints]
workspace = true

[dependencies]
oxrok-core.workspace = true
log.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
