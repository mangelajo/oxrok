[package]
name = "oxrok-hil"
description = "Hardware in the loop checks for oxrok drivers, driven by the ESP32 signal generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "oxrok-hil"
path = "src/main.rs"

[dependencies]
oxrok-core.workspace = true
oxrok-usb = { workspace = true, features = ["nusb"] }
oxrok-driver-logicport.workspace = true
log.workspace = true
serialport = { version = "4", default-features = false }

[lints]
workspace = true
