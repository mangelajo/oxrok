[package]
name = "oxrok-emu"
description = "USB/IP device server: device models attached through vhci-hcd, so drivers are checked against sigrok-cli without the hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later OR Apache-2.0"
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "oxrok-emu"
path = "src/main.rs"

[dependencies]
aes = "0.9"
clap.workspace = true
ctrlc = { version = "3", features = ["termination"] }
serde_json = "1"
sha2 = "0.10"
vusb = "0.1.1"

[lints]
workspace = true
