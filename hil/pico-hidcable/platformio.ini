; HID cable emulator for the oxrok serial-dmm tests, on a Raspberry Pi Pico.
; Needs the earlephilhower core (Adafruit TinyUSB) for a custom HID device.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
build_flags = -DUSE_TINYUSB -DCFG_TUD_USBTMC=1
upload_protocol = picotool
monitor_speed = 115200
